<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="You build the next thing. ExoKortex turns your project progress into portfolio updates, ready for your review. Open source. Always your work."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ExoKortex</title>
    <script>
      (function () {
        var stored = localStorage.getItem("exokortex-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
