[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exokortex"
version = "0.1.0"
description = "Personal knowledge engine: capture notes, embed them, ask questions with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exokortex = "exokortex.cli:main"

[tool.setuptools.packages.find]
include = ["exokortex*"]

[tool.setuptools.package-data]
exokortex = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]