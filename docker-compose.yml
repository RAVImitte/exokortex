services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: exokortex
      POSTGRES_PASSWORD: exokortex
      POSTGRES_DB: exokortex
    ports:
      - "${EXOKORTEX_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exokortex -d exokortex"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      EXOKORTEX_DATABASE_URL: postgresql://exokortex:exokortex@db:5432/exokortex
    ports:
      - "${EXOKORTEX_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: